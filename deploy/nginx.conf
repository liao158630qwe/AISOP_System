events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    upstream aisop_api {
        server api:8000;
        keepalive 32;
    }
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    client_max_body_size 500m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;
    server { listen 80; return 308 https://$host$request_uri; }
    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /api/v1/login {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            error_page 429 = @login_limited;
            proxy_pass http://aisop_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
        location @login_limited {
            default_type application/json;
            add_header Retry-After 10 always;
            add_header Cache-Control no-store always;
            return 429 '{"code":"LOGIN_RATE_LIMITED","message":"登录尝试过多，请稍后重试"}';
        }
        location ~ ^/api/v1/(realtime/frame|station-streams/[0-9a-f-]+/frames)$ {
            proxy_pass http://aisop_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            client_max_body_size 1m;
            # Browser model preparation can wait 60s on the first request.
            proxy_read_timeout 65s;
            client_body_timeout 5s;
        }
        # Model transfer and CPU verification can outlast the ordinary API timeout.
        location ~ ^/api/v1/admin/(models/(upload|import)|datasets/[0-9a-f-]+/videos)$ {
            proxy_pass http://aisop_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_body_timeout 120s;
        }
        location / {
            proxy_pass http://aisop_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_read_timeout 120s;
        }
        # API authenticates the artifact request and returns X-Accel-Redirect;
        # nginx then streams the large file without occupying an API worker.
        location /_protected-runs/ {
            internal;
            alias /data/runs/;
            add_header Cache-Control "private, max-age=60";
        }
        location /_protected-evidence/ {
            internal;
            alias /data/evidence/;
            add_header Cache-Control "private, no-store";
        }
    }
}
