events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    client_max_body_size 500m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;
    server { listen 80; return 308 https://$host$request_uri; }
    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /api/v1/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
        }
        location / {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
        }
        # API authenticates the artifact request and returns X-Accel-Redirect;
        # nginx then streams the large file without occupying an API worker.
        location /_protected-runs/ {
            internal;
            alias /data/runs/;
            add_header Cache-Control "private, max-age=60";
        }
    }
}
