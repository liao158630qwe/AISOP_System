<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>六工位设备管理 · AI-SOP</title><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="terminal.css"></head><body>
<header class="site-header"><a class="brand-link" href="/"><span class="brand-mark">SOP</span><strong>六工位设备管理</strong></a><a href="/terminal">工位终端入口</a><button id="account">管理员登录</button></header>
<main class="workspace"><div class="page-heading"><div><h1>工位、工位机与相机绑定</h1><p>每个工位固定一台工位机与一路相机；检测任务由管理员配置。</p></div><button id="refresh">刷新状态</button></div>
<p id="message" class="status-line" role="status"></p><div id="stations" class="cards"></div>
<form id="binding-form" class="form-section" hidden><h2>登记或更新设备</h2><p class="notice">配置变化时签发新凭据；配置未变时保留原凭据。请先停止该工位采集，再更新配置或重新签发。螺丝、贴条专项仅适用于已标定视角。</p><p id="draft-note" class="status-line" role="status"></p><div class="form-grid">
<label>工位<select id="station"></select></label><label>工位机编号<input id="workstation" required pattern="[A-Za-z0-9_-]{1,60}" value="pc-01"></label><label>相机逻辑编号<input id="camera" required pattern="[A-Za-z0-9_-]{1,60}" value="cam-01"></label>
<label>接入方式<select id="source"><option value="rtsp">网络相机 / 常驻采集服务</option><option value="usb">USB / 本机摄像头</option></select></label>
<label>检测任务<select id="analysis"><option value="manual">人工检查（暂未接入AI）</option><option value="pose">人体姿态观察</option><option value="screw">已标定螺丝专项</option><option value="sticker">已标定贴条专项</option><option value="scene">自定义场景</option></select></label><label>已发布场景<select id="scene"><option value="">请选择已发布且可用的场景</option></select></label>
<label>目标检测帧率<input id="sample-fps" type="number" min="0.5" max="30" step="0.5" value="4" required></label><label>允许有效采样间隔（秒）<input id="sample-gap" type="number" min="0.1" max="3" step="0.1" value="1" required></label>
<label>预览网关地址（可选）<input id="preview-url" placeholder="/media/cam-01/"></label><label class="checkbox-label"><input id="enabled" type="checkbox" checked>启用工位</label></div><div class="form-actions"><button class="primary" type="submit">保存配置</button><button id="reload-binding" type="button">重新载入配置</button><button id="rotate-key" type="button" disabled>重新签发凭据</button></div><p>重新载入会丢弃本工位尚未保存的修改；重新签发会立即撤销旧凭据和会话。</p></form>
<section id="issued" hidden><h2 id="issued-title">新设备凭据</h2><p>仅此处显示一次。交给对应工位机或写入采集服务的私有环境变量。</p><pre id="issued-key" class="terminal-credential"></pre><button id="copy-key" type="button">复制凭据</button><button id="hide-key" type="button">隐藏凭据</button></section></main><script src="workspace-api.js"></script><script src="terminals.js"></script></body></html>
