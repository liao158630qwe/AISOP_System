<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>工位终端 · AI-SOP</title><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="terminal.css"></head>
<body><header class="site-header"><div class="brand-link"><span class="brand-mark">SOP</span><div><strong>工位终端</strong><small>固定工位 · 独立检测流</small></div></div><button id="logout" hidden>退出终端</button></header>
<main class="workspace terminal-workspace"><p id="message" class="status-line" role="status"></p><section id="login-panel"><div class="page-heading"><div><h1>连接本工位</h1><p>输入管理员为本台工位机签发的设备凭据。</p></div></div><form id="terminal-login" class="login-form"><label>设备凭据<input id="credential" type="password" autocomplete="off" required minlength="32" maxlength="200"></label><button class="primary" type="submit">连接工位</button></form></section>
<section id="terminal-panel" hidden><div class="page-heading"><div><h1 id="station-name"></h1><p id="binding-name"></p></div><span id="online" class="badge review">待采样</span></div><p id="task-note" class="notice"></p>
<div class="terminal-controls" id="usb-controls"><label>本机摄像头<select id="device"><option value="">请先授权并选择设备</option></select></label><button id="authorize" type="button">授权摄像头</button><button id="start" class="primary" type="button">开始检测</button><button id="finish" type="button" disabled>结束并归档</button><label>停止原因<select id="stop-reason"><option>调试结束，本轮检测未完成</option><option>相机或网络异常，需要复核本轮检测</option><option>检测中断，需要重新开始</option><option>设备维护或换班，停止采集</option></select></label><button id="stop" type="button" disabled>停止采集</button></div>
<p id="sampling-note" class="notice" role="status">等待采样状态</p>
<section id="final-record" class="notice" hidden><strong>已归档的算法结果</strong><p id="final-text"></p><p>结果按工位和检测轮次保存，并同步到大屏统计。</p></section>
<div class="terminal-stage"><video id="preview" autoplay muted playsinline></video><p id="usb-note" hidden>开始检测后显示本机摄像头画面</p><iframe id="network-preview" title="网络相机预览" hidden allow="autoplay; fullscreen"></iframe><img id="sample-preview" alt="本工位检测采样画面" hidden><span id="sample-caption" hidden>检测采样预览 · 非原始视频</span><div id="network-note" hidden>网络相机由常驻采集服务接入，检测采样画面与结果会自动更新。</div></div>
<div class="stats"><div class="stat"><span>有效检测帧率</span><strong id="fps">—</strong></div><div class="stat"><span title="从服务器收到采样起计，包含状态查询往返；不含相机曝光至上传的耗时">结果年龄（接收后）</span><strong id="age">—</strong></div><div class="stat"><span>服务器处理</span><strong id="latency">—</strong></div></div><section class="terminal-result" aria-live="polite"><h2 id="decision">等待有效采样</h2><p id="reason"></p><p id="identity" class="code"></p></section>
<section class="terminal-history"><div class="page-heading"><h2>本工位最近检测记录</h2><button id="refresh-history" type="button">刷新记录</button></div><p>显示最近 20 轮，正常结束和中断分别记录，可查看检测结果、设备和结束原因。</p><div id="inspection-history" aria-live="polite">尚无记录</div></section></section></main><script src="terminal.js"></script></body></html>
